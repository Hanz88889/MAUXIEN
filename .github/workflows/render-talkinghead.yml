name: Render Talking Head

on:
  workflow_dispatch:
    inputs:
      video:
        description: Nama file video di public/videos (contoh sample.mp4)
        required: true
        type: string
      video_url:
        description: Link unduh video (kosongkan jika file sudah ada di repo)
        required: false
        type: string
      title:
        description: Judul kecil di pojok frame (boleh kosong)
        required: false
        type: string
      keywords:
        description: Kata kunci dipisah koma (boleh kosong)
        required: false
        type: string
      model:
        description: Model Whisper
        required: false
        default: small
        type: choice
        options:
          - base
          - small
          - medium
      language:
        description: Kode bahasa ucapan
        required: false
        default: id
        type: string
      stills:
        description: Buat 3 gambar cek posisi teks
        required: false
        default: true
        type: boolean

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VIDEO: ${{ inputs.video }}
      VIDEO_URL: ${{ inputs.video_url }}
      TITLE: ${{ inputs.title }}
      KEYWORDS: ${{ inputs.keywords }}
      WHISPER_MODEL: ${{ inputs.model }}
      WHISPER_LANG: ${{ inputs.language }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Validate input
        run: |
          case "$VIDEO" in
            *[!A-Za-z0-9._-]*)
              echo "Nama file hanya boleh huruf, angka, titik, minus, underscore"
              exit 1
              ;;
          esac
          NAME="${VIDEO%.*}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: whisper.cpp
          key: whisper-1.5.5-${{ inputs.model }}

      - name: Install dependencies
        run: npm install

      - name: Fetch video
        if: ${{ inputs.video_url != '' }}
        run: |
          mkdir -p public/videos
          curl -fL --retry 3 -o "public/videos/$VIDEO" "$VIDEO_URL"

      - name: Check video exists
        run: |
          if [ ! -f "public/videos/$VIDEO" ]; then
            echo "Video tidak ditemukan: public/videos/$VIDEO. Upload ke repo atau isi video_url."
            exit 1
          fi

      - name: Transcribe
        run: |
          if [ -f "public/data/$NAME.timeline.json" ]; then
            echo "Timeline JSON kustom ditemukan (public/data/$NAME.timeline.json), melewati proses Transcribe..."
          else
            node scripts/transcribe.mjs "$VIDEO"
          fi

      - name: Build timeline
        run: |
          if [ -f "public/data/$NAME.timeline.json" ]; then
            echo "Menggunakan Timeline JSON kustom yang sudah ada..."
          else
            node scripts/make-timeline.mjs "$VIDEO"
          fi

      - name: Check stills
        if: ${{ inputs.stills }}
        run: |
          mkdir -p out
          FRAMES=$(node -e "const t=require('./public/data/$NAME.timeline.json');const n=Math.floor(t.durationSec*t.fps);console.log([0.2,0.5,0.8].map(p=>Math.floor(n*p)).join(' '))")
          I=1
          for F in $FRAMES; do
            npx remotion still src/index.ts TalkingHead "out/check-$I.png" --frame=$F --props="{\"name\":\"$NAME\"}" --timeout=120000
            I=$((I+1))
          done

      - name: Render
        run: |
          mkdir -p out
          npx remotion render src/index.ts TalkingHead "out/$NAME.mp4" --props="{\"name\":\"$NAME\"}" --timeout=120000

      - uses: actions/upload-artifact@v4
        with:
          name: talking-head-${{ env.NAME }}
          path: out/
